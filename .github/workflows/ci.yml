name: CI

# Security: Do not replace `pull_request` with `pull_request_target` to expose secrets or
# GITHUB_TOKEN write access to PR code. pull_request_target runs untrusted fork PR code with
# base-branch privileges.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  id-token: write

env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_AGENT_GUIDANCE: 'false'
  # Repository branch pushes and same-repository PRs share the remote cache.
  # Fork PRs, tag pushes, and runs without TURBO_TEAM stay local.
  TURBO_CACHE: >-
    ${{ vars.TURBO_TEAM != '' &&
        ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) ||
         (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
        'local:rw,remote:rw' || 'local:rw' }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Set up Turborepo Remote Cache
        if: ${{ env.TURBO_CACHE == 'local:rw,remote:rw' && env.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ env.TURBO_TEAM }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - run: npm run lint:check

  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Set up Turborepo Remote Cache
        if: ${{ env.TURBO_CACHE == 'local:rw,remote:rw' && env.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ env.TURBO_TEAM }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - run: npm run prettier:check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Set up Turborepo Remote Cache
        if: ${{ env.TURBO_CACHE == 'local:rw,remote:rw' && env.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ env.TURBO_TEAM }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run tests
        run: npm run test:coverage -- --ci --reporters=jest-junit

      - name: Upload tests coverage results
        uses: codecov/codecov-action@v5

  typescript:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Set up Turborepo Remote Cache
        if: ${{ env.TURBO_CACHE == 'local:rw,remote:rw' && env.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ env.TURBO_TEAM }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - run: npm run type:check

  depcheck:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Set up Turborepo Remote Cache
        if: ${{ env.TURBO_CACHE == 'local:rw,remote:rw' && env.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ env.TURBO_TEAM }}

      - name: Restore node_modules
        uses: actions/cache@v5
        id: api-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-api-node-modules-${{ hashFiles('package-lock.json') }}-${{ secrets.CACHE_VERSION }}

      - name: Install dependencies
        if: steps.api-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - run: npm run depcheck
